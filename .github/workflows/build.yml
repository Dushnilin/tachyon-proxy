name: Build & Auto-Sync Android APK & iOS IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    # Каждые 3 часа проверяем, не вышел ли новый релиз ядра Dushnilin/tachyon-core
    - cron: '0 */3 * * *'
  repository_dispatch:
    types: [core-updated]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check-core:
    name: Check latest tachyon-core
    runs-on: ubuntu-latest
    outputs:
      latest_core: ${{ steps.core_check.outputs.latest_core }}
      latest_tag: ${{ steps.core_check.outputs.latest_tag }}
      app_ver: ${{ steps.core_check.outputs.app_ver }}
      skip: ${{ steps.core_check.outputs.skip }}
    steps:
      - name: Checkout tachyon-proxy
        uses: actions/checkout@v4

      - name: Check latest tachyon-core release
        id: core_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag=$(gh api repos/Dushnilin/tachyon-core/releases/latest --jq '.tag_name' 2>/dev/null | tr -d '\r' || true)
          if [ -z "$latest_tag" ] || [ "$latest_tag" = "null" ]; then
            echo "::error::Не удалось получить последний релиз из Dushnilin/tachyon-core"
            exit 1
          fi
          latest_core="${latest_tag#v}"
          app_ver=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f1 | tr -d '\r')
          prev_core=$(curl -fsSL "https://github.com/Dushnilin/tachyon-proxy/releases/download/latest/version.json" 2>/dev/null | jq -r '.core_version // empty' || true)

          echo "latest_core=${latest_core}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${latest_tag}" >> "$GITHUB_OUTPUT"
          echo "app_ver=${app_ver}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "schedule" ] && [ "$prev_core" = "$latest_core" ]; then
            echo "Ядро в релизе уже актуально (${latest_core}), пропускаем плановую сборку."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build-apk:
    name: Build Android APKs
    needs: [check-core]
    if: needs.check-core.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tachyon-proxy
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download libtachyon-*.so from Dushnilin/tachyon-core release
        run: |
          latest_tag="${{ needs.check-core.outputs.latest_tag }}"
          base_url="https://github.com/Dushnilin/tachyon-core/releases/download/${latest_tag}"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a android/app/src/main/jniLibs/armeabi-v7a android/app/src/main/jniLibs/x86_64
          curl -fsSL --retry 3 -o android/app/src/main/jniLibs/arm64-v8a/libtachyon.so "${base_url}/libtachyon-arm64-v8a.so"
          curl -fsSL --retry 3 -o android/app/src/main/jniLibs/armeabi-v7a/libtachyon.so "${base_url}/libtachyon-armeabi-v7a.so"
          curl -fsSL --retry 3 -o android/app/src/main/jniLibs/x86_64/libtachyon.so "${base_url}/libtachyon-x86_64.so"
          ls -lh android/app/src/main/jniLibs/*/libtachyon.so

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

      - name: Build per-ABI release APKs
        run: flutter build apk --release --split-per-abi

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Stage APK artifacts
        run: |
          mkdir -p dist-android
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist-android/tachyon-proxy-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist-android/tachyon-proxy-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist-android/tachyon-proxy-x86_64.apk
          cp build/app/outputs/flutter-apk/app-release.apk dist-android/tachyon-proxy-universal.apk
          cp build/app/outputs/flutter-apk/app-release.apk dist-android/tachyon-proxy-android-tv.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tachyon-proxy-android
          path: dist-android/*
          if-no-files-found: error

  build-ios:
    name: Build iOS IPA
    needs: [check-core]
    if: needs.check-core.outputs.skip != 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout tachyon-proxy
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download TachyonCore.xcframework from Dushnilin/tachyon-core release
        run: |
          latest_tag="${{ needs.check-core.outputs.latest_tag }}"
          url="https://github.com/Dushnilin/tachyon-core/releases/download/${latest_tag}/tachyon-core-ios-xcframework-${latest_tag}.tar.gz"
          mkdir -p ios/Frameworks /tmp/xcf
          curl -fsSL --retry 3 -o /tmp/xcf/tachyon-core-ios-xcframework.tar.gz "$url"
          tar -xzf /tmp/xcf/tachyon-core-ios-xcframework.tar.gz -C ios/Frameworks
          ls -la ios/Frameworks/TachyonCore.xcframework

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release (.app + PacketTunnelExtension.appex)
        run: flutter build ios --release --no-codesign

      - name: Sign ad-hoc with NetworkExtension entitlements & package IPA
        run: |
          app_dir="build/ios/iphoneos/Runner.app"
          ext_dir="${app_dir}/PlugIns/PacketTunnelExtension.appex"
          test -d "$app_dir"
          test -d "$ext_dir"

          # Подписываем ad-hoc с вшиванием entitlements (для TrollStore / SideStore / AltStore / ESign / Feather)
          codesign --force --sign - \
            --entitlements ios/PacketTunnelExtension/PacketTunnelExtension.entitlements \
            --timestamp=none \
            "$ext_dir"

          codesign --force --sign - \
            --entitlements ios/Runner/Runner.entitlements \
            --timestamp=none \
            "$app_dir"

          mkdir -p /tmp/ipa-stage/Payload dist-ios
          cp -R "$app_dir" /tmp/ipa-stage/Payload/Runner.app
          (cd /tmp/ipa-stage && zip -qry "$GITHUB_WORKSPACE/dist-ios/tachyon-proxy-ios.ipa" Payload)
          ls -lh dist-ios/tachyon-proxy-ios.ipa

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: tachyon-proxy-ios
          path: dist-ios/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [check-core, build-apk, build-ios]
    if: needs.check-core.outputs.skip != 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: tachyon-proxy-android
          path: dist

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: tachyon-proxy-ios
          path: dist

      - name: Generate version.json and SHA256SUMS.txt
        run: |
          core_ver="${{ needs.check-core.outputs.latest_core }}"
          app_ver="${{ needs.check-core.outputs.app_ver }}"
          cat > dist/version.json <<EOF
          {
            "app_version": "${app_ver}",
            "core_version": "${core_ver}",
            "commit": "${GITHUB_SHA}",
            "apk_arm64": "https://github.com/Dushnilin/tachyon-proxy/releases/download/latest/tachyon-proxy-arm64-v8a.apk",
            "apk_armv7": "https://github.com/Dushnilin/tachyon-proxy/releases/download/latest/tachyon-proxy-armeabi-v7a.apk",
            "apk_x86_64": "https://github.com/Dushnilin/tachyon-proxy/releases/download/latest/tachyon-proxy-x86_64.apk",
            "apk_android_tv": "https://github.com/Dushnilin/tachyon-proxy/releases/download/latest/tachyon-proxy-android-tv.apk",
            "ipa_ios": "https://github.com/Dushnilin/tachyon-proxy/releases/download/latest/tachyon-proxy-ios.ipa",
            "so_arm64": "https://github.com/Dushnilin/tachyon-core/releases/latest/download/libtachyon-arm64-v8a.so",
            "so_armv7": "https://github.com/Dushnilin/tachyon-core/releases/latest/download/libtachyon-armeabi-v7a.so",
            "so_x86_64": "https://github.com/Dushnilin/tachyon-core/releases/latest/download/libtachyon-x86_64.so"
          }
          EOF

          cd dist && sha256sum *.apk *.ipa version.json > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish rolling release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Tachyon Proxy v${{ needs.check-core.outputs.app_ver }} (Core v${{ needs.check-core.outputs.latest_core }}) — Latest"
          body: |
            Сборка **Tachyon Proxy v${{ needs.check-core.outputs.app_ver }}** со встроенным нативным ядром **`tachyon-core v${{ needs.check-core.outputs.latest_core }}`**.

            ### 📦 Установочные пакеты Android, Android TV и iOS
            - **`tachyon-proxy-ios.ipa`** — сборка для **iOS / iPadOS 15.0+** (`arm64`, `NEPacketTunnelProvider` + `TachyonCore.xcframework`, установка через TrollStore / SideStore / AltStore / ESign / Feather)
            - **`tachyon-proxy-android-tv.apk`** — сборка для **Android TV / Google TV и ТВ-приставок** (32-bit `armeabi-v7a` + 64-bit `arm64-v8a`, Leanback-лончер, управление пультом ДУ / D-pad, приём подписок с телефона по Wi-Fi QR)
            - **`tachyon-proxy-arm64-v8a.apk`** — для большинства современных смартфонов и планшетов (64-bit ARM)
            - **`tachyon-proxy-armeabi-v7a.apk`** — для 32-bit ARM устройств и лёгких приставок
            - **`tachyon-proxy-x86_64.apk`** — для эмуляторов и x86_64 систем
            - **`tachyon-proxy-universal.apk`** — универсальный пакет со всеми архитектурами
          files: dist/*
          prerelease: false
          make_latest: false

      - name: Publish versioned release (v*)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.check-core.outputs.app_ver }}"
          name: "⚡ Tachyon Proxy v${{ needs.check-core.outputs.app_ver }} (Core v${{ needs.check-core.outputs.latest_core }})"
          body: |
            Сборка **Tachyon Proxy v${{ needs.check-core.outputs.app_ver }}** со встроенным нативным ядром **`tachyon-core v${{ needs.check-core.outputs.latest_core }}`**.

            ### 📦 Установочные пакеты Android, Android TV и iOS
            - **`tachyon-proxy-ios.ipa`** — сборка для **iOS / iPadOS 15.0+** (`arm64`, `NEPacketTunnelProvider` + `TachyonCore.xcframework`, установка через TrollStore / SideStore / AltStore / ESign / Feather)
            - **`tachyon-proxy-android-tv.apk`** — сборка для **Android TV / Google TV и ТВ-приставок** (32-bit `armeabi-v7a` + 64-bit `arm64-v8a`, Leanback-лончер, управление пультом ДУ / D-pad, приём подписок с телефона по Wi-Fi QR)
            - **`tachyon-proxy-arm64-v8a.apk`** — для большинства современных смартфонов и планшетов (64-bit ARM)
            - **`tachyon-proxy-armeabi-v7a.apk`** — для 32-bit ARM устройств и лёгких приставок
            - **`tachyon-proxy-x86_64.apk`** — для эмуляторов и x86_64 систем
            - **`tachyon-proxy-universal.apk`** — универсальный пакет со всеми архитектурами
          generate_release_notes: true
          files: dist/*
          make_latest: true
