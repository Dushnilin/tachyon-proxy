name: Build & Auto-Sync Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    # Каждые 3 часа проверяем, не вышел ли новый релиз ядра Dushnilin/tachyon-core
    - cron: '0 */3 * * *'
  repository_dispatch:
    types: [core-updated]
  workflow_dispatch:
    inputs:
      force_rebuild_core:
        description: 'Принудительно пересобрать libtachyon.so из tachyon-core-src'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tachyon-proxy
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tachyon-core version & decide whether to run
        id: core_check
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          current_core=$(grep -m1 '^version = ' native/core-ffi/Cargo.toml | cut -d '"' -f2 | tr -d '\r')
          latest_tag=$(gh api repos/Dushnilin/tachyon-core/releases/latest --jq '.tag_name' 2>/dev/null | tr -d '\r' || true)
          if [[ ! "$latest_tag" =~ ^v[0-9]+\.[0-9]+ ]]; then
            latest_tag="v${current_core}"
          fi
          latest_core="${latest_tag#v}"
          app_ver=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f1 | tr -d '\r')
          echo "current_core=${current_core}" >> "$GITHUB_OUTPUT"
          echo "latest_core=${latest_core}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${latest_tag}" >> "$GITHUB_OUTPUT"
          echo "app_ver=${app_ver}" >> "$GITHUB_OUTPUT"

          # Проверяем также, изменился ли бинарник libtachyon-arm64-v8a.so в релизе tachyon-core
          local_sha=$(sha256sum android/app/src/main/jniLibs/arm64-v8a/libtachyon.so 2>/dev/null | awk '{print $1}' || true)
          remote_sha=$(curl -fsSL "https://github.com/Dushnilin/tachyon-core/releases/download/${latest_tag}/SHA256SUMS" 2>/dev/null | grep 'libtachyon-arm64-v8a\.so' | awk '{print $1}' | head -n 1 || true)

          if [ "${{ github.event_name }}" = "schedule" ] && [ "$current_core" = "$latest_core" ] && ( [ -z "$remote_sha" ] || [ "$local_sha" = "$remote_sha" ] ); then
            echo "Ядро уже актуально (${current_core}), пропускаем плановую сборку."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "sync_core=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            if [ "$current_core" != "$latest_core" ] || [ "${{ github.event_name }}" = "repository_dispatch" ] || [ "${{ github.event.inputs.force_rebuild_core }}" = "true" ] || ( [ -n "$remote_sha" ] && [ "$local_sha" != "$remote_sha" ] ); then
              echo "sync_core=true" >> "$GITHUB_OUTPUT"
            else
              echo "sync_core=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Download prebuilt libtachyon.so from Dushnilin/tachyon-core release
        id: dl_core
        if: steps.core_check.outputs.skip != 'true' && steps.core_check.outputs.sync_core == 'true'
        run: |
          latest_tag="${{ steps.core_check.outputs.latest_tag }}"
          latest_core="${{ steps.core_check.outputs.latest_core }}"
          base_url="https://github.com/Dushnilin/tachyon-core/releases/download/${latest_tag}"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a android/app/src/main/jniLibs/armeabi-v7a android/app/src/main/jniLibs/x86_64
          if curl -fsSL --retry 3 -o android/app/src/main/jniLibs/arm64-v8a/libtachyon.so "${base_url}/libtachyon-arm64-v8a.so" && \
             curl -fsSL --retry 3 -o android/app/src/main/jniLibs/armeabi-v7a/libtachyon.so "${base_url}/libtachyon-armeabi-v7a.so" && \
             curl -fsSL --retry 3 -o android/app/src/main/jniLibs/x86_64/libtachyon.so "${base_url}/libtachyon-x86_64.so"; then
            sed -i "s/^version = \".*\"/version = \"${latest_core}\"/" native/core-ffi/Cargo.toml
            echo "downloaded=true" >> "$GITHUB_OUTPUT"
            echo "Готовые libtachyon-*.so успешно скачаны из релиза Dushnilin/tachyon-core (${latest_tag})."
          else
            echo "downloaded=false" >> "$GITHUB_OUTPUT"
            echo "В релизе ${latest_tag} нет готовых .so — потребуется сборка из исходников."
          fi

      - name: Checkout tachyon-core-src (fallback when prebuilt .so not in release)
        if: steps.core_check.outputs.skip != 'true' && steps.core_check.outputs.sync_core == 'true' && steps.dl_core.outputs.downloaded != 'true' && env.PRIVATE_TOKEN != ''
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        uses: actions/checkout@v4
        with:
          repository: Dushnilin/tachyon-core-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ steps.core_check.outputs.latest_tag }}
          path: .core-src

      - name: Install Rust toolchain for Android NDK (fallback)
        if: steps.core_check.outputs.skip != 'true' && steps.core_check.outputs.sync_core == 'true' && steps.dl_core.outputs.downloaded != 'true' && env.PRIVATE_TOKEN != ''
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Compile libtachyon.so for all Android ABIs (fallback)
        if: steps.core_check.outputs.skip != 'true' && steps.core_check.outputs.sync_core == 'true' && steps.dl_core.outputs.downloaded != 'true' && env.PRIVATE_TOKEN != ''
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          latest_core="${{ steps.core_check.outputs.latest_core }}"
          sed -i "s/^version = \".*\"/version = \"${latest_core}\"/" native/core-ffi/Cargo.toml

          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            ndk=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -n 1)
          fi
          bin_dir="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export AR="$bin_dir/llvm-ar"

          build_abi() {
            local triple="$1"
            local abi="$2"
            local clang="$bin_dir/$3"
            local upper=$(echo "$triple" | tr 'a-z-' 'A-Z_')
            local lower=$(echo "$triple" | tr '-' '_')
            export "CARGO_TARGET_${upper}_LINKER=$clang"
            export "CARGO_TARGET_${upper}_AR=$bin_dir/llvm-ar"
            export "CC_${lower}=$clang"
            export "AR_${lower}=$bin_dir/llvm-ar"
            cargo rustc -p core-ffi --release --target "$triple" --crate-type cdylib --manifest-path .core-src/Cargo.toml
            mkdir -p "android/app/src/main/jniLibs/$abi"
            cp ".core-src/target/$triple/release/libtachyon.so" "android/app/src/main/jniLibs/$abi/libtachyon.so"
          }

          build_abi "aarch64-linux-android" "arm64-v8a" "aarch64-linux-android24-clang"
          build_abi "armv7-linux-androideabi" "armeabi-v7a" "armv7a-linux-androideabi24-clang"
          build_abi "x86_64-linux-android" "x86_64" "x86_64-linux-android24-clang"
          rm -rf .core-src

      - name: Commit updated libtachyon.so to main
        if: steps.core_check.outputs.skip != 'true' && steps.core_check.outputs.sync_core == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/core-ffi/Cargo.toml android/app/src/main/jniLibs/
          if ! git diff --cached --quiet; then
            git commit -m "chore(core): автообновление ядра tachyon-core до v${{ steps.core_check.outputs.latest_core }}"
            git push origin HEAD:main
          fi

      - name: Set up JDK 21
        if: steps.core_check.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        if: steps.core_check.outputs.skip != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        if: steps.core_check.outputs.skip != 'true'
        run: flutter pub get

      - name: Analyze Dart code
        if: steps.core_check.outputs.skip != 'true'
        run: flutter analyze

      - name: Run unit tests
        if: steps.core_check.outputs.skip != 'true'
        run: flutter test

      - name: Build per-ABI release APKs
        if: steps.core_check.outputs.skip != 'true'
        run: flutter build apk --release --split-per-abi

      - name: Build universal release APK
        if: steps.core_check.outputs.skip != 'true'
        run: flutter build apk --release

      - name: Prepare release artifacts (APKs + .so + version.json)
        if: steps.core_check.outputs.skip != 'true'
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/tachyon-proxy-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/tachyon-proxy-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/tachyon-proxy-x86_64.apk
          cp build/app/outputs/flutter-apk/app-release.apk dist/tachyon-proxy-universal.apk
          cp build/app/outputs/flutter-apk/app-release.apk dist/tachyon-proxy-android-tv.apk
          cp android/app/src/main/jniLibs/arm64-v8a/libtachyon.so dist/libtachyon-arm64-v8a.so
          cp android/app/src/main/jniLibs/armeabi-v7a/libtachyon.so dist/libtachyon-armeabi-v7a.so
          cp android/app/src/main/jniLibs/x86_64/libtachyon.so dist/libtachyon-x86_64.so

          core_ver=$(grep -m1 '^version = ' native/core-ffi/Cargo.toml | cut -d '"' -f2 | tr -d '\r')
          app_ver="${{ steps.core_check.outputs.app_ver }}"
          cat > dist/version.json <<EOF
          {
            "app_version": "${app_ver}",
            "core_version": "${core_ver}",
            "commit": "${GITHUB_SHA}",
            "apk_arm64": "https://github.com/Dushnilin/tachyon-proxy/releases/download/latest/tachyon-proxy-arm64-v8a.apk",
            "apk_armv7": "https://github.com/Dushnilin/tachyon-proxy/releases/download/latest/tachyon-proxy-armeabi-v7a.apk",
            "apk_x86_64": "https://github.com/Dushnilin/tachyon-proxy/releases/download/latest/tachyon-proxy-x86_64.apk",
            "apk_android_tv": "https://github.com/Dushnilin/tachyon-proxy/releases/download/latest/tachyon-proxy-android-tv.apk",
            "so_arm64": "https://github.com/Dushnilin/tachyon-core/releases/latest/download/libtachyon-arm64-v8a.so",
            "so_armv7": "https://github.com/Dushnilin/tachyon-core/releases/latest/download/libtachyon-armeabi-v7a.so",
            "so_x86_64": "https://github.com/Dushnilin/tachyon-core/releases/latest/download/libtachyon-x86_64.so"
          }
          EOF

          cd dist && sha256sum *.apk *.so version.json > SHA256SUMS.txt

      - name: Upload APK artifacts
        if: steps.core_check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tachyon-proxy-apks
          path: dist/*
          if-no-files-found: error

      - name: Publish rolling release (latest)
        if: steps.core_check.outputs.skip != 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Tachyon Proxy v${{ steps.core_check.outputs.app_ver }} (Core v${{ steps.core_check.outputs.latest_core }}) — Latest"
          body: |
            Автоматическая сборка **Tachyon Proxy v${{ steps.core_check.outputs.app_ver }}** со встроенным ядром **`tachyon-core v${{ steps.core_check.outputs.latest_core }}`** (${{ github.sha }}).

            ### 📦 Установочные пакеты Android и Android TV (APK)
            - **`tachyon-proxy-android-tv.apk`** — сборка для **Android TV / Google TV и ТВ-приставок** (32-bit `armeabi-v7a` + 64-bit `arm64-v8a`, Leanback-лончер, управление пультом ДУ / D-pad, приём подписок с телефона по Wi-Fi QR)
            - **`tachyon-proxy-arm64-v8a.apk`** — для большинства современных смартфонов и планшетов (64-bit ARM)
            - **`tachyon-proxy-armeabi-v7a.apk`** — для 32-bit ARM устройств и лёгких приставок
            - **`tachyon-proxy-x86_64.apk`** — для эмуляторов и x86_64 систем
            - **`tachyon-proxy-universal.apk`** — универсальный пакет со всеми архитектурами

            ### ⚡ Модули движка для встроенного обновления (`libtachyon-*.so`)
            - **`libtachyon-arm64-v8a.so`**, **`libtachyon-armeabi-v7a.so`**, **`libtachyon-x86_64.so`**, **`version.json`**
          files: dist/*
          prerelease: false
          make_latest: false

      - name: Publish versioned release (v*)
        if: steps.core_check.outputs.skip != 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.core_check.outputs.app_ver }}"
          name: "⚡ Tachyon Proxy v${{ steps.core_check.outputs.app_ver }} (Core v${{ steps.core_check.outputs.latest_core }})"
          generate_release_notes: true
          files: dist/*
          make_latest: true
