<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="304" viewBox="0 0 1200 304"
     role="img" aria-labelledby="title desc">
  <title id="title">Архитектура конвейера трафика tachyon-proxy</title>
  <desc id="desc">Четыре этапа обработки сетевого потока: сборка конфигурации в Dart, захват пакетов системным туннелем Android/iOS, классификация в Rust-ядре tachyon-core и отправка через целевой контур.</desc>

  <rect width="1200" height="304" rx="16" fill="#141415"/>
  <rect x="0.5" y="0.5" width="1199" height="303" rx="15.5" fill="none" stroke="#2e2e32" stroke-width="1"/>

  <!-- Header -->
  <text x="32" y="40" fill="#ededed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="20" font-weight="500">Конвейер прохождения пакетов · Flutter → Системный TUN → Rust FFI</text>
  <text x="32" y="64" fill="#85858b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400">Единая схема маршрутизации для Android (JNI libtachyon.so) и iOS / iPadOS (C-ABI TachyonCore.xcframework)</text>

  <!-- Step 1 (268px) -->
  <g transform="translate(32, 88)">
    <rect x="0" y="0" width="268" height="184" rx="12" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
    <text x="20" y="32" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500">Этап 01 · RuntimeConfig</text>
    <text x="20" y="60" fill="#ededed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="500">Конфигуратор и списки</text>
    <text x="20" y="88" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400">Парсинг подписок и URI,</text>
    <text x="20" y="108" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400">загрузка баз .trs по SHA-256</text>
    <text x="20" y="136" fill="#85858b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">Генерация JSON-схемы ядра</text>
    <text x="20" y="158" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">lib/core/models/</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <line x1="300" y1="180" x2="320" y2="180" stroke="#2e2e32" stroke-width="1"/>

  <!-- Step 2 (268px) -->
  <g transform="translate(320, 88)">
    <rect x="0" y="0" width="268" height="184" rx="12" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
    <text x="20" y="32" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500">Этап 02 · System Tunnel</text>
    <text x="20" y="60" fill="#ededed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="500">Захват дескриптора TUN</text>
    <text x="20" y="88" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400">Android VpnService (tun fd)</text>
    <text x="20" y="108" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400">и iOS NEPacketTunnel (utun)</text>
    <text x="20" y="136" fill="#85858b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">Защита сокетов от петель</text>
    <text x="20" y="158" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">protect_path / App Group</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <line x1="588" y1="180" x2="608" y2="180" stroke="#2e2e32" stroke-width="1"/>

  <!-- Step 3: Highlighted Moment (272px) -->
  <g transform="translate(608, 88)">
    <rect x="0" y="0" width="272" height="184" rx="12" fill="#19191b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <text x="20" y="32" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500">Этап 03 · tachyon-core</text>
    <text x="20" y="60" fill="#ededed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="500">Классификация и DNS</text>
    <text x="20" y="88" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400">Резолвинг FakeIP 198.18.0.0/15</text>
    <text x="20" y="108" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400">и TLS SNI / HTTP-сниффинг</text>
    <text x="20" y="136" fill="#85858b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">Поиск по таблицам без копирования</text>
    <text x="20" y="158" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">zero-copy mmap (*.trs)</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <line x1="880" y1="180" x2="900" y2="180" stroke="#2e2e32" stroke-width="1"/>

  <!-- Step 4 (268px) -->
  <g transform="translate(900, 88)">
    <rect x="0" y="0" width="268" height="184" rx="12" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
    <text x="20" y="32" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500">Этап 04 · Outbounds</text>
    <text x="20" y="60" fill="#ededed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="500">Четыре контура выхода</text>
    <text x="20" y="88" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400">1. Proxy (VLESS, Hy2, TUIC, WG)</text>
    <text x="20" y="108" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400">2. Desync (Fake+Split / TTL)</text>
    <text x="20" y="136" fill="#85858b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">3. Direct (.ru и банки мимо VPN)</text>
    <text x="20" y="158" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">4. Block (реклама и UDP:443)</text>
  </g>
</svg>
