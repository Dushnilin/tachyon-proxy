<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">tachyon-proxy — кроссплатформенный клиент маршрутизации и туннелирования</title>
  <desc id="desc">Клиент селективной маршрутизации, туннелирования и адаптивной сегментации трафика на базе Rust-движка tachyon-core для Android, Android TV и iOS / iPadOS.</desc>

  <!-- Canvas -->
  <rect width="1200" height="400" rx="16" fill="#141415"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="15.5" fill="none" stroke="#2e2e32" stroke-width="1"/>

  <!-- Left column: identity, stack, metrics -->
  <g transform="translate(40, 40)">
    <!-- Status tag -->
    <rect x="0" y="0" width="356" height="28" rx="6" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#38bdf8"/>
    <text x="26" y="18" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">tachyon client · android · android tv · ios</text>

    <!-- Title & description -->
    <text x="0" y="76" fill="#ededed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="48" font-weight="500" letter-spacing="-1">tachyon-proxy</text>
    <text x="0" y="112" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="400">Клиент селективной маршрутизации, туннелирования и шейпинга</text>
    <text x="0" y="136" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="400">поверх нативного Rust-движка tachyon-core для мобильных ОС и ТВ</text>

    <!-- Target protocols & modules -->
    <g transform="translate(0, 164)">
      <rect x="0" y="0" width="124" height="32" rx="6" fill="#19191b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="62" y="20" text-anchor="middle" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500">tachyon-core</text>

      <rect x="132" y="0" width="136" height="32" rx="6" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
      <text x="200" y="20" text-anchor="middle" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400">VLESS · REALITY</text>

      <rect x="276" y="0" width="124" height="32" rx="6" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
      <text x="338" y="20" text-anchor="middle" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400">XHTTP · Hy2</text>

      <rect x="408" y="0" width="104" height="32" rx="6" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
      <text x="460" y="20" text-anchor="middle" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400">DPI Desync</text>

      <rect x="520" y="0" width="64" height="32" rx="6" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
      <text x="552" y="20" text-anchor="middle" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400">.trs</text>
    </g>

    <!-- Stat cards (same height 68px, 4px grid) -->
    <g transform="translate(0, 216)">
      <rect x="0" y="0" width="184" height="68" rx="8" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
      <text x="16" y="28" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="500">3 ОС</text>
      <text x="72" y="28" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400">в одном коде</text>
      <text x="16" y="50" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">Android · TV · iOS 15+</text>

      <rect x="196" y="0" width="184" height="68" rx="8" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
      <text x="212" y="28" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="500">9</text>
      <text x="232" y="28" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400">протоколов</text>
      <text x="212" y="50" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">прокси + нативный Desync</text>

      <rect x="392" y="0" width="192" height="68" rx="8" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
      <text x="408" y="28" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="500">Zero-Copy</text>
      <text x="408" y="50" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">FakeIP + mmap .trs базы</text>
    </g>

    <!-- Routing action legend -->
    <g transform="translate(0, 304)">
      <circle cx="6" cy="8" r="4" fill="#38bdf8"/>
      <text x="18" y="12" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500">Proxy / Desync</text>
      <text x="128" y="12" fill="#85858b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">туннель и шейпинг</text>

      <circle cx="244" cy="8" r="4" fill="#4cc38a"/>
      <text x="256" y="12" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500">Direct</text>
      <text x="306" y="12" fill="#85858b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">напрямую в РФ</text>

      <circle cx="420" cy="8" r="4" fill="#e5484d"/>
      <text x="432" y="12" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500">Block</text>
      <text x="478" y="12" fill="#85858b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">реклама и QUIC</text>
    </g>
  </g>

  <!-- Right column: live tunnel specimen -->
  <g transform="translate(664, 32)">
    <rect x="0" y="0" width="496" height="336" rx="12" fill="#0f0f10" stroke="#2e2e32" stroke-width="1"/>

    <!-- Specimen header -->
    <rect x="0" y="0" width="496" height="36" rx="12" fill="#19191b"/>
    <rect x="0" y="24" width="496" height="12" fill="#19191b"/>
    <line x1="0" y1="36" x2="496" y2="36" stroke="#2e2e32" stroke-width="1"/>
    <text x="16" y="23" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">tun0 / utun → libtachyon.so / TachyonCore</text>
    <circle cx="412" cy="19" r="3.5" fill="#4cc38a"/>
    <text x="480" y="23" text-anchor="end" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500">active</text>

    <!-- Stage 1: Session & Outbound -->
    <g transform="translate(16, 52)">
      <rect x="0" y="0" width="464" height="72" rx="8" fill="#141415" stroke="#2e2e32" stroke-width="1"/>
      <text x="16" y="24" fill="#ededed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="500">1. Системный туннель и активный узел</text>
      <text x="448" y="24" text-anchor="end" fill="#4cc38a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500">HTTP 204 · 48 ms</text>
      <text x="16" y="44" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">VLESS · XHTTP · REALITY (uTLS Chrome) · FakeIP 198.18.0.0/15</text>
      <text x="16" y="60" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">VpnService (Android) · NEPacketTunnelProvider (iOS)</text>
    </g>

    <!-- Connector 1 -->
    <line x1="248" y1="124" x2="248" y2="140" stroke="#2e2e32" stroke-width="1"/>

    <!-- Stage 2: Highlighted moment (Hybrid Routing + Desync) -->
    <g transform="translate(16, 140)">
      <rect x="0" y="0" width="464" height="80" rx="8" fill="#19191b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="16" y="24" fill="#ededed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="500">2. Гибридная маршрутизация и DPI Desync</text>
      <text x="448" y="24" text-anchor="end" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500">fake_split · autottl</text>
      <text x="16" y="46" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">YouTube и Discord через пакетный Desync без участия сервера</text>
      <text x="16" y="64" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">Зарубежные ИИ и сервисы в Proxy · банки и госсайты РФ в Direct</text>
    </g>

    <!-- Connector 2 -->
    <line x1="248" y1="220" x2="248" y2="236" stroke="#2e2e32" stroke-width="1"/>

    <!-- Stage 3: Telemetry & Protection -->
    <g transform="translate(16, 236)">
      <rect x="0" y="0" width="226" height="84" rx="8" fill="#141415" stroke="#2e2e32" stroke-width="1"/>
      <text x="16" y="24" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500">Поток и телеметрия</text>
      <text x="16" y="46" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">↓ 8.4 МБ/с · ↑ 412 КБ/с</text>
      <text x="16" y="66" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">34 активных TCP/UDP узла</text>

      <rect x="238" y="0" width="226" height="84" rx="8" fill="#141415" stroke="#2e2e32" stroke-width="1"/>
      <text x="254" y="24" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500">Защита сокетов и DNS</text>
      <text x="254" y="46" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">protect_path · DoH · .trs</text>
      <text x="254" y="66" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">SHA-256 верификация баз</text>
    </g>
  </g>
</svg>
