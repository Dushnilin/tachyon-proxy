<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="390" viewBox="0 0 1200 390"
     role="img" aria-labelledby="title desc">
  <title id="title">Tachyon Proxy — Android VPN &amp; DPI Bypass Client</title>
  <desc id="desc">Android VPN and DPI desynchronization client powered by the Rust tachyon-core engine via JNI, supporting VLESS REALITY, XHTTP, Hysteria2, TUIC, FakeIP, and per-app/per-service routing.</desc>

  <defs>
    <radialGradient id="dialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6FD08C" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#B9A8FF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0B0B0D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sparkFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6FD08C" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6FD08C" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Canvas background (Morphe Dark #0B0B0D) -->
  <rect width="1200" height="390" rx="24" fill="#0B0B0D"/>
  <rect x="1" y="1" width="1198" height="388" rx="23" fill="none" stroke="#26262B" stroke-width="2"/>

  <!-- Left column: Identity, Value, Protocol & Engine badges -->
  <g id="title-block" transform="translate(56, 48)">
    <!-- Eyebrow / Wordmark cue -->
    <circle cx="8" cy="10" r="5" fill="#B9A8FF"/>
    <text x="24" y="15"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="16" font-weight="600" letter-spacing="3.5" fill="#A8A8AD">
      TACHYON ECOSYSTEM · ANDROID VPN &amp; DPI BYPASS
    </text>

    <!-- Main repository title -->
    <text x="0" y="76"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="54" font-weight="700" letter-spacing="-1.2" fill="#F2F2F3">
      tachyon-proxy
    </text>

    <!-- Plain-language value proposition -->
    <text x="0" y="120"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="21" font-weight="400" fill="#A8A8AD">
      Нативный Android-клиент поверх Rust-ядра <tspan fill="#F2F2F3" font-weight="600">tachyon-core</tspan>.
    </text>
    <text x="0" y="150"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="21" font-weight="400" fill="#A8A8AD">
      Туннелирование, пакетный обход ТСПУ (Desync) и маршрутизация.
    </text>

    <!-- Protocol & transport pills -->
    <g transform="translate(0, 184)">
      <rect x="0" y="0" width="148" height="34" rx="17" fill="#2A2440" stroke="#B9A8FF" stroke-opacity="0.5"/>
      <text x="74" y="22" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="15" font-weight="600" fill="#B9A8FF">VLESS · REALITY</text>

      <rect x="160" y="0" width="128" height="34" rx="17" fill="#141417" stroke="#26262B"/>
      <text x="224" y="22" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="15" font-weight="600" fill="#F2F2F3">XHTTP · gRPC</text>

      <rect x="300" y="0" width="154" height="34" rx="17" fill="#141417" stroke="#26262B"/>
      <text x="377" y="22" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="15" font-weight="600" fill="#F2F2F3">Hysteria2 · TUIC</text>

      <rect x="466" y="0" width="144" height="34" rx="17" fill="#292218" stroke="#E5C07B" stroke-opacity="0.55"/>
      <text x="538" y="22" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="15" font-weight="600" fill="#E5C07B">DPI Desync</text>
    </g>

    <!-- Bottom technical metadata -->
    <g transform="translate(0, 254)">
      <rect x="0" y="0" width="610" height="44" rx="12" fill="#141417" stroke="#26262B"/>
      <circle cx="22" cy="22" r="5" fill="#6FD08C"/>
      <text x="38" y="27"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="15.5" fill="#A8A8AD">
        JNI FFI <tspan fill="#70707A">→</tspan> <tspan fill="#F2F2F3">libtachyon.so</tspan> <tspan fill="#70707A">·</tspan> FakeIP 198.18.0.0/15 <tspan fill="#70707A">·</tspan> .trs rules
      </text>
    </g>
  </g>

  <!-- Right column: Native Product Specimen (Morphe UI Dashboard Card) -->
  <g id="product-specimen" transform="translate(716, 34)">
    <circle cx="214" cy="112" r="110" fill="url(#dialGlow)"/>

    <!-- Phone card frame -->
    <rect x="0" y="0" width="428" height="322" rx="20" fill="#141417" stroke="#26262B" stroke-width="1.5"/>

    <!-- Top bar inside card -->
    <circle cx="28" cy="28" r="4" fill="#B9A8FF"/>
    <text x="42" y="33"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="15" font-weight="700" letter-spacing="3" fill="#F2F2F3">TACHYON</text>
    <rect x="304" y="15" width="102" height="26" rx="13" fill="#192B20" stroke="#6FD08C" stroke-opacity="0.5"/>
    <text x="355" y="33" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13.5" font-weight="600" fill="#6FD08C">ПОДКЛЮЧЕНО</text>

    <!-- Power ring & active session timer -->
    <g transform="translate(24, 58)">
      <circle cx="52" cy="52" r="46" fill="none" stroke="#6FD08C" stroke-width="1.5" stroke-opacity="0.65"/>
      <circle cx="52" cy="52" r="36" fill="#6FD08C" fill-opacity="0.1" stroke="#6FD08C" stroke-opacity="0.35"/>
      <path d="M52 34 L52 50 M42 40 A14 14 0 1 0 62 40"
            fill="none" stroke="#6FD08C" stroke-width="2.4" stroke-linecap="round"/>

      <text x="120" y="42"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="28" font-weight="700" fill="#F2F2F3">02:41:18</text>
      <text x="120" y="68"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-size="17" font-weight="600" fill="#B9A8FF">DE · XHTTP · REALITY</text>
      <text x="120" y="92"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="14.5" fill="#6FD08C">HTTP 204: 48 ms · FakeIP</text>
    </g>

    <!-- Mode bar -->
    <g transform="translate(24, 174)">
      <rect x="0" y="0" width="380" height="36" rx="10" fill="#0B0B0D" stroke="#26262B"/>
      <rect x="4" y="4" width="118" height="28" rx="7" fill="#2A2440" stroke="#B9A8FF" stroke-opacity="0.6"/>
      <text x="63" y="23" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-size="14" font-weight="600" fill="#B9A8FF">По правилам</text>
      <text x="178" y="23" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-size="14" fill="#E5C07B">Обход DPI</text>
      <text x="275" y="23" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-size="14" fill="#A8A8AD">Весь трафик</text>
      <text x="350" y="23" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-size="14" fill="#70707A">RU</text>
    </g>

    <!-- Live traffic & sparkline card -->
    <g transform="translate(24, 222)">
      <rect x="0" y="0" width="380" height="78" rx="12" fill="#0B0B0D" stroke="#26262B"/>
      <text x="16" y="26"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="15" font-weight="600" fill="#B9A8FF">↑ 412 КБ/с</text>
      <text x="142" y="26"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="15" font-weight="600" fill="#6FD08C">↓ 8.4 МБ/с</text>
      <text x="282" y="26"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="14" fill="#A8A8AD">34 соед.</text>

      <!-- Sparkline curve -->
      <path d="M16 64 L54 60 L92 52 L130 56 L168 42 L206 47 L244 36 L282 40 L320 32 L364 35 L364 68 L16 68 Z"
            fill="url(#sparkFill)"/>
      <path d="M16 64 L54 60 L92 52 L130 56 L168 42 L206 47 L244 36 L282 40 L320 32 L364 35"
            fill="none" stroke="#6FD08C" stroke-width="2"/>
    </g>
  </g>
</svg>
